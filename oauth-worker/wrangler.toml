name = "nautilus-log-auth"
main = "src/worker.mjs"
compatibility_date = "2026-08-30"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://roamresearch.com"
PUBLIC_BASE_URL = "https://nautilus-auth.kidsseeghosts.art"

[[d1_databases]]
binding = "NAUTILUS_AUTH_DB"
database_name = "nautilus-log-auth"
database_id = "REPLACE_WITH_PRODUCTION_D1_ID"
migrations_dir = "migrations"
